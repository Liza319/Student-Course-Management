{% extends 'students/base.html' %}
{% block title %}My Files{% endblock %}

{% block content %}
<h3>Uploaded Files</h3>

<table class="table table-striped table-bordered">
    <thead class="table-light">
        <tr>
            <th>File</th>
            <th>Course</th>
            <th>Date</th>
            <th>Download</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody>
        {% for file in files %}
        <tr>
            <td>{{ file.file.name }}</td>
            <td>{{ file.course.name }}</td>
            <td>{{ file.timestamp|date:"Y-m-d H:i" }}</td>
            <td><a href="{{ file.file.url }}" class="btn btn-sm btn-outline-info" download>Download</a></td>
            <td><a href="{% url 'delete' file.id %}" class="btn btn-sm btn-outline-danger">Delete</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
