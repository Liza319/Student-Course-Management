<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Student CMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">Student Course Management System</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% if user.is_authenticated %}
        <p>Welcome, <strong>{{ user.username }}</strong> | <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger">Logout</a></p>
    {% else %}
        <p><a href="{% url 'login' %}" class="btn btn-sm btn-outline-primary">Login</a> |
           <a href="{% url 'register' %}" class="btn btn-sm btn-outline-success">Register</a></p>
    {% endif %}

    <hr>
    {% block content %}{% endblock %}
</div>
</body>
</html>
